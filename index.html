<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>香港神託會培敦中學 - 校園氣象與交通儀表板</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#0f172a}

/* 容器視窗：保持標準 16:9 (1920x1080) 基準並根據屏幕自動縮放與居中 */
#app-scaler{
  width:1920px;
  height:1080px;
  position:absolute;
  top:50%;
  left:50%;
  transform-origin:center center;
  display:grid;
  grid-template-rows:80px 1fr 90px;
  gap:16px;
  padding:20px;
  background:#f8fafc radial-gradient(#cbd5e1 1.5px,transparent 1.5px);
  background-size:24px 24px;
  color:#1e293b;
}

header,.card,footer{
  background:#ffffffef;
  border-radius:20px;
  box-shadow:0 6px 24px rgba(0,0,0,0.06);
  backdrop-filter:blur(10px);
}

/* 頂部導覽列 */
header{
  padding:0 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.header-row{
  display:flex;
  align-items:center;
  gap:20px;
  width:100%;
}
.school-name{
  font-size:32px;
  font-weight:900;
  color:#fff;
  letter-spacing:.04em;
  -webkit-text-stroke:1.2px #0369a1;
  text-shadow:-2px -2px #0284c7, 2px -2px #0284c7, -2px 2px #0284c7, 2px 2px #0284c7;
  padding-right:20px;
  border-right:3px solid #cbd5e1;
}
.date-time-box{
  display:flex;
  align-items:center;
  gap:16px;
  margin-left:auto;
}
.date{font-size:28px;font-weight:800;color:#e11d48}
.time{font-size:32px;font-weight:900;color:#0284c7;font-variant-numeric:tabular-nums}

/* 主體佈局 */
main{
  display:grid;
  grid-template-columns:460px 1fr;
  gap:20px;
  min-height:0;
}
.card{
  padding:22px;
  display:flex;
  flex-direction:column;
  min-height:0;
}
.head{
  font-size:22px;
  font-weight:800;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:12px;
  border-bottom:2px dashed #e2e8f0;
}
.badge{
  font-size:15px;
  font-weight:600;
  padding:4px 12px;
  border-radius:12px;
  background:#f1f5f9;
  color:#64748b;
}

/* 氣象卡片 */
.weather{
  flex:1;
  padding-top:16px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.hero{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(135deg,#eff6ff 0%,#dbeafe 100%);
  padding:16px 20px;
  border-radius:16px;
  border:1px solid #bfdbfe;
}
.temp{font-size:68px;font-weight:900;line-height:1;color:#1d4ed8}
.desc{
  font-size:22px;
  font-weight:800;
  background:#fff;
  color:#0369a1;
  padding:8px 16px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(3,105,161,0.1);
}
.rain-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.rain-card{
  background:#f8fafc;
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:16px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:4px;
}
.label{font-size:18px;font-weight:700;color:#64748b}
.value{font-size:30px;font-weight:900;color:#0f172a;line-height:1.2}
.sub{font-size:14px;color:#94a3b8;margin-top:2px}

/* 巴士到站卡片 */
.bus-view{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding-top:14px;
  min-height:0;
}
.bus-group{
  background:#f8fafc;
  padding:12px 14px;
  border:1px solid #e2e8f0;
  border-radius:16px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.bus-title{
  font-size:20px;
  font-weight:900;
  color:#334155;
  display:flex;
  align-items:center;
  gap:8px;
}
.route-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.route{
  background:#fff;
  border-radius:12px;
  padding:8px 14px;
  display:flex;
  align-items:center;
  box-shadow:0 2px 6px rgba(0,0,0,0.03);
  border:1px solid #f1f5f9;
}
.route-meta{
  display:flex;
  align-items:center;
  gap:14px;
}
.route-no{
  font-size:26px;
  font-weight:900;
  line-height:1;
  background:#00838f;
  color:#fff;
  padding:6px 12px;
  border-radius:8px;
  min-width:90px;
  text-align:center;
}
.route-dest{
  font-size:20px;
  font-weight:800;
  color:#1e293b;
}
.etas{
  display:flex;
  gap:12px;
  margin-left:auto;
}
.eta{
  background:#f1f5f9;
  border-radius:10px;
  padding:6px 14px;
  text-align:center;
  min-width:115px;
}
.eta-clock{font-size:17px;font-weight:800;color:#64748b}
.eta-min{font-size:22px;font-weight:900;color:#2563eb;line-height:1.1}
.no-bus{padding:10px;color:#94a3b8;font-weight:700;font-size:16px}

/* 底部走馬燈 (CSS 物理動畫版) */
footer{
  display:flex;
  align-items:center;
  background:#fff;
  border:1px solid #cbd5e1;
  overflow:hidden;
}
.tag{
  height:100%;
  width:220px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  flex:none;
  background:#bd3c28;
  color:#fff;
  border-right:3px solid #8e2719;
  font-weight:900;
  line-height:1;
  z-index:2;
}
.rthk{font-size:32px;letter-spacing:1px}
.news-label{font-size:18px;margin-top:4px}
.marquee-wrap{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  position:relative;
  display:flex;
  align-items:center;
}
.marquee{
  display:inline-block;
  white-space:nowrap;
  font-size:30px;
  font-weight:800;
  color:#0f172a;
  will-change:transform;
}

@keyframes rollPhysical {
  0% {
    transform: translateX(var(--start-x, 1600px));
  }
  100% {
    transform: translateX(var(--end-x, -2000px));
  }
}
</style>
</head>
<body>

<div id="app-scaler">
  <header>
    <div class="header-row">
      <div class="school-name">香港神託會培敦中學</div>
      <div class="date-time-box">
        <div class="date" id="date">--年--月--日</div>
        <div class="time" id="time">--:--:--</div>
      </div>
    </div>
  </header>
  <main>
    <section class="card">
      <div class="head"><span>☀️ 即時校園氣象數據</span><span class="badge" id="station">黃大仙站</span></div>
      <div class="weather">
        <div class="hero">
          <div class="temp" id="temp">--°C</div>
          <div><div class="desc" id="desc">載入中</div></div>
        </div>
        <div class="rain-grid">
          <div class="rain-card"><span class="label">相對濕度</span><span class="value" id="hum">--%</span></div>
          <div class="rain-card"><span class="label">這刻降雨狀況</span><span class="value" id="rain">0 mm</span><span class="sub">過去一小時雨量</span></div>
        </div>
        <div class="rain-card"><span class="label">下一個小時降雨機率</span><span class="value" id="next">分析中...</span><span class="sub">預報源：天文台天色分析</span></div>
      </div>
    </section>
    <section class="card bus-card">
      <div class="head"><span>🚌 巴士到站時間</span><span class="badge" id="bs">即時刷新</span></div>
      <div class="bus-view">
        <div class="bus-group">
          <div class="bus-title">🚏 真鐸學校</div>
          <div class="route-list" id="s1"></div>
        </div>
        <div class="bus-group">
          <div class="bus-title">🚏 斧山道運動場</div>
          <div class="route-list" id="s2"></div>
        </div>
      </div>
    </section>
  </main>
  <footer>
    <div class="tag" id="tag"><span class="rthk">NEWS</span><span class="news-label">即時新聞</span></div>
    <div class="marquee-wrap" id="marquee-wrap">
      <div class="marquee" id="marquee">香港神託會培敦中學即時氣象與交通系統運行中</div>
    </div>
  </footer>
</div>

<script>
const $=id=>document.getElementById(id),
      K='https://data.etabus.gov.hk/v1/transport/kmb',
      H='https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc';
let routes, stamp=0, stops={};

/* 自動全屏等比縮放適配 */
function autoScale() {
  const scaler = document.getElementById('app-scaler');
  const baseW = 1920;
  const baseH = 1080;
  const winW = window.innerWidth;
  const winH = window.innerHeight;
  const scale = Math.min(winW / baseW, winH / baseH);
  scaler.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

window.addEventListener('resize', autoScale);
window.addEventListener('load', autoScale);
autoScale();

async function get(u){let r=await fetch(u);if(!r.ok)throw Error();return r.json()}

function clock(){
  let n=new Date,w='日一二三四五六';
  $('date').textContent=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日 (${w[n.getDay()]})`;
  $('time').textContent=`${n.getHours()>=12?'下午':'上午'}${String(n.getHours()%12||12).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;
}

async function weather(){
  try{
    let d=await get(H),t=d.temperature.data.find(x=>x.place==='黃大仙')||d.temperature.data[0],q=d.rainfall.data.find(x=>x.place==='黃大仙'),r=q?.max||0;
    $('temp').textContent=t.value+'°C';
    $('hum').textContent=d.humidity.data[0].value+'%';
    $('rain').textContent=r+' mm';
    $('desc').textContent=r?'有驟雨':'大致天晴';
    $('next').textContent=r>=10?'高':r?'中':'低';
    $('station').textContent=t.place+'站';
  }catch(e){
    $('station').textContent='數據連線中...'
  }
}

async function allRoutes(){
  if(routes&&Date.now()-stamp<12e4)return routes;
  routes=(await get(K+'/route/')).data;
  stamp=Date.now();
  return routes
}

let groups=[
  ['s1',[['3D','觀塘','慈雲山','往 慈雲山(中)',10],['3M','彩雲','慈雲山','往 慈雲山(北)',5],['203E','彩虹','九龍站','往 九龍站',2]]],
  ['s2',[['3D','慈雲山','觀塘','往 觀塘(裕民坊)',8],['3M','慈雲山','彩雲','往 彩雲',8],['203E','九龍站','彩虹','往 彩虹',25]]]
];

function tm(x){
  let d=new Date(x),h=d.getHours();
  return`${h>=12?'下午':'上午'}${String(h%12||12).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`
}

async function eta(c){
  try{
    let r=(await allRoutes()).find(x=>x.route===c[0]&&x.orig_tc.includes(c[1])&&x.dest_tc.includes(c[2]));
    if(!r)return[];
    let b=r.bound==='O'?'outbound':'inbound',k=c[0]+b+c[4],p=stops[k]||(stops[k]=(await get(`${K}/route-stop/${c[0]}/${b}/1`)).data.find(x=>+x.seq===c[4])?.stop);
    return p?(await get(`${K}/eta/${p}/${c[0]}/1`)).data.filter(x=>x.eta&&x.dir===r.bound&&new Date(x.eta)>Date.now()-3e4).sort((a,b)=>new Date(a.eta)-new Date(b.eta)).slice(0,2):[]
  }catch(e){
    return[]
  }
}

function row(c,a){
  let z=a.map(x=>{
    let m=Math.max(0,Math.round((new Date(x.eta)-Date.now())/6e4));
    return`<div class="eta"><div class="eta-clock">${tm(x.eta)}</div><div class="eta-min">${m?m+'分鐘':'即將到達'}</div></div>`
  }).join('')||'<div class="no-bus">暫無即時班次</div>';
  return`<div class="route"><div class="route-meta"><div class="route-no">${c[0]}</div><div class="route-dest">${c[3]}</div></div><div class="etas">${z}</div></div>`
}

async function buses(){
  await Promise.all(groups.map(async([id,a])=>$(id).innerHTML=(await Promise.all(a.map(eta))).map((x,i)=>row(a[i],x)).join('')));
  $('bs').textContent='更新於 '+new Date().toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'});
}

/* ================= 嚴格按「每秒2隻字」的動態動畫控制器 ================= */
function setMarqueeText(text) {
  const m = $('marquee');
  const wrap = $('marquee-wrap');
  if (!m || !wrap) return;

  m.textContent = text;
  
  // 計算總字數（包含標點符號）
  const charCount = text.length;
  
  // 核心規則：每秒播放 2 隻字
  // 570 字 => 570 / 2 = 285 秒
  // 為了讓右側進入到左側離開都完美符合節奏，每字給予 0.5 秒
  const duration = Math.max(1, Math.round(charCount / 200000));
  
  // 視窗寬度與文字寬度 (px)
  const wrapW = wrap.clientWidth || 1600;
  const textW = m.scrollWidth || (charCount * 30);
  
  // 設置 CSS 自定義變數精確控制起點與終點
  m.style.setProperty('--start-x', wrapW + 'px');
  m.style.setProperty('--end-x', (-textW - 100) + 'px');
  
  // 重新觸發動畫
  m.style.animation = 'none';
  m.offsetHeight; // 強制重繪
  m.style.animation = `rollPhysical ${duration}s linear infinite`;
  
  console.log(`[走馬燈更新] 總字數: ${charCount} 字，總播放時間: ${duration} 秒 (嚴格每秒 2 隻字)`);
}

async function fetchNews(){
  try{
    let r=await fetch('./news.json?t='+Date.now());
    if(!r.ok)throw Error();
    let data=await r.json();
    if(data&&data.length>0){
      setMarqueeText(data.join('  ✦  '));
      return;
    }
  }catch(e){}
  setMarqueeText('香港神託會培敦中學即時氣象與交通系統運行中');
}

clock();
weather();
buses();
fetchNews();

setInterval(clock,1000);
setInterval(buses,20000);
setInterval(weather,300000);
setInterval(fetchNews,900000);
</script>
</body>
</html>
