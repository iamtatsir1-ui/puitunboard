<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.1, maximum-scale=5.0, user-scalable=yes">

<!-- Apple iOS 主畫面 Icon 及 Web App 設定 -->
<link rel="apple-touch-icon" href="https://files.catbox.moe/55u3d5.png">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="培敦儀表板">

<link rel="icon" type="image/png" href="https://files.catbox.moe/55u3d5.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://files.catbox.moe/55u3d5.png">
<link rel="icon" type="image/png" sizes="512x512" href="https://files.catbox.moe/55u3d5.png">

<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif}
html,body{
  width:100%;
  height:100%;
  background:#0f172a;
  touch-action:pan-x pan-y pinch-zoom;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
}

/* 最外層包裝：確保在不同螢幕尺寸下自動居中並提供滾動/平移空間 */
#stage-wrapper{
  width:100%;
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

/* 容器視窗：標準 4:3 比例 (2160x1620 像素基準) 根據螢幕等比縮放居中 */
#app-scaler{
  width:2160px;
  height:1620px;
  transform-origin:center center;
  display:grid;
  grid-template-rows:120px 1fr 130px;
  gap:24px;
  padding:28px;
  background:#f8fafc radial-gradient(#cbd5e1 1.5px,transparent 1.5px);
  background-size:28px 28px;
  color:#1e293b;
  flex:none;
}

header,.card,footer{
  background:#ffffffef;
  border-radius:24px;
  box-shadow:0 8px 30px rgba(0,0,0,0.06);
  backdrop-filter:blur(10px);
}

/* 頂部導覽列 */
header{
  padding:0 36px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.header-row{
  display:flex;
  align-items:center;
  gap:28px;
  width:100%;
}

/* 學校名稱：藍色轉橙色漸進色彩 */
.school-name{
  font-size:42px;
  font-weight:800;
  letter-spacing:.02em;
  padding-right:28px;
  border-right:3.5px solid #cbd5e1;
  background:linear-gradient(100deg, #0284c7 0%, #0369a1 40%, #ea580c 80%, #f97316 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  color:transparent;
  display:inline-block;
}

.date-time-box{
  display:flex;
  align-items:center;
  gap:24px;
  margin-left:auto;
}
.date{font-size:36px;font-weight:800;color:#e11d48}
.time{font-size:44px;font-weight:900;color:#0284c7;font-variant-numeric:tabular-nums}

/* 主體佈局：平分左右 4:3 比例 (1fr 1fr) */
main{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:28px;
  min-height:0;
}
.card{
  padding:30px;
  display:flex;
  flex-direction:column;
  min-height:0;
  overflow:hidden;
}
.head{
  font-size:34px;
  font-weight:900;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:18px;
  border-bottom:3px dashed #e2e8f0;
  flex:none;
}
.badge{
  font-size:22px;
  font-weight:800;
  padding:6px 20px;
  border-radius:14px;
  background:#f1f5f9;
  color:#64748b;
  transition:all .3s ease;
}

/* 氣象卡片 (左側 50%)：三個區塊 1.25fr : 1fr : 1fr 對稱分配 */
.weather{
  flex:1;
  padding-top:18px;
  display:grid;
  grid-template-rows:1.25fr 1fr 1fr;
  gap:20px;
  min-height:0;
}

/* 第 1 格：左側氣溫 + 右側動態自適應條狀卡片 */
.hero-container{
  background:linear-gradient(135deg,#eff6ff 0%,#dbeafe 100%);
  padding:20px 28px;
  border-radius:24px;
  border:2.5px solid #bfdbfe;
  height:100%;
  display:flex;
  align-items:center;
  gap:28px;
  min-height:0;
  overflow:hidden;
}

/* 左側氣溫：大字極致強化 (支援動態漸變色與安全縮小) */
.naked-temp-zone{
  flex:none;
  width:430px;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:flex-start;
  border-right:3.5px dashed #bfdbfe;
  padding-right:24px;
  overflow:hidden;
}
.naked-temp-label{
  font-size:30px;
  font-weight:800;
  color:#64748b;
  letter-spacing:0.5px;
  flex:none;
}
.naked-temp-val{
  font-size:126px;
  font-weight:900;
  color:#1d4ed8;
  line-height:0.95;
  font-variant-numeric:tabular-nums;
  margin:4px 0 6px 0;
  text-shadow:0 4px 16px rgba(29,78,216,0.2);
  letter-spacing:-2px;
  white-space:nowrap;
  max-width:100%;
  transition:color 0.4s ease, text-shadow 0.4s ease;
}
.naked-temp-sub{
  font-size:24px;
  font-weight:800;
  color:#0284c7;
  flex:none;
}

/* 右側動態卡片容器 */
.two-rows-container{
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  gap:14px;
  min-width:0;
  min-height:0;
  overflow:hidden;
}

/* 條狀卡片統一規格 */
.info-row-card{
  background:#ffffff;
  border:2.5px solid #dbeafe;
  border-radius:20px;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 4px 12px rgba(3,105,161,0.05);
  min-width:0;
  min-height:0;
  gap:16px;
  flex:1;
  overflow:hidden;
  transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* 天況卡片放大撐滿時的強化樣式 */
.info-row-card.is-expanded{
  padding:0 32px;
  background:linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
  border-color:#93c5fd;
  box-shadow:0 8px 20px rgba(3,105,161,0.08);
}
.info-row-card.is-expanded .row-label-tag{
  font-size:36px;
  padding:8px 22px;
  border-radius:18px;
}

.row-label-tag{
  font-size:30px;
  font-weight:900;
  color:#475569;
  background:#f1f5f9;
  padding:6px 18px;
  border-radius:14px;
  flex:none;
}
.row-wx-content{
  display:flex;
  align-items:center;
  gap:16px;
  flex:1;
  min-width:0;
  height:100%;
  overflow:hidden;
  justify-content:flex-start;
}
.row-wx-emoji{
  font-size:68px;
  line-height:1;
  flex:none;
  transition:font-size 0.15s ease;
}

/* 允許文字換至下一行繼續，並支援自適應縮放至 100% 容納 */
.row-wx-text{
  font-size:46px;
  font-weight:900;
  color:#0369a1;
  white-space:normal;
  word-break:break-word;
  line-height:1.15;
  display:block;
  overflow:visible;
  flex:1 1 auto;
  min-width:0;
  transition:font-size 0.15s ease;
}

.row-warn-content{
  display:flex;
  align-items:center;
  gap:12px;
  flex:1;
  min-width:0;
  height:100%;
  overflow:hidden;
  justify-content:flex-start;
}
.warn-strip-item{
  background:#fff7ed;
  border:2.5px solid #fed7aa;
  border-radius:16px;
  padding:8px 18px;
  display:inline-flex;
  align-items:center;
  gap:12px;
  max-height:92%;
  flex:1 1 auto;
  min-width:0;
  overflow:hidden;
}
.warn-strip-icon-box{
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
}
.warn-strip-icon-box img{
  height:52px;
  width:auto;
  max-width:68px;
  object-fit:contain;
  display:block;
}
.warn-strip-text{
  font-size:32px;
  font-weight:900;
  color:#9a3412;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  flex:1;
  min-width:0;
}

/* 第 2 格 與 第 3 格：大字體與空間填滿最佳化 */
.two-cols-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  height:100%;
  min-height:0;
}
.metric-card{
  background:#f8fafc;
  border:2.5px solid #e2e8f0;
  border-radius:24px;
  padding:0 30px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:8px;
  height:100%;
  min-height:0;
  overflow:hidden;
}
.label{font-size:32px;font-weight:800;color:#64748b;flex:none}
.value{
  font-size:78px;
  font-weight:900;
  color:#0f172a;
  line-height:1.02;
  white-space:nowrap;
  max-width:100%;
  overflow:hidden;
}
.sub{font-size:22px;font-weight:700;color:#94a3b8;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 空氣質素卡片專用排版 */
.aqhi-card-content{
  display:flex;
  align-items:baseline;
  gap:20px;
  overflow:hidden;
  max-width:100%;
}
.aqhi-badge{
  font-size:30px;
  font-weight:900;
  padding:6px 22px;
  border-radius:16px;
  color:#fff;
  line-height:1;
  flex:none;
}

/* 巴士到站卡片 (右側 50%)：嚴格防溢出與自適應架構 */
.bus-card{
  overflow:hidden;
}
.bus-view{
  flex:1;
  display:grid;
  grid-template-rows:1fr 1fr;
  gap:20px;
  padding-top:18px;
  min-height:0;
  overflow:hidden;
}
.bus-group{
  background:#f8fafc;
  padding:16px 22px;
  border:2.5px solid #e2e8f0;
  border-radius:24px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-height:0;
  height:100%;
  overflow:hidden;
}
.bus-title{
  font-size:34px;
  font-weight:900;
  color:#1e293b;
  display:flex;
  align-items:center;
  gap:14px;
  padding-bottom:10px;
  border-bottom:2.5px solid #e2e8f0;
  flex:none;
}
.route-list{
  flex:1;
  display:grid;
  grid-template-rows:1fr 1fr 1fr;
  gap:10px;
  min-height:0;
  padding-top:10px;
  overflow:hidden;
}
.route{
  background:#fff;
  border-radius:18px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 4px 10px rgba(0,0,0,0.03);
  border:2px solid #f1f5f9;
  height:100%;
  min-height:0;
  min-width:0;
  gap:12px;
  overflow:hidden;
}
.route-meta{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
  flex:1 1 auto;
  overflow:hidden;
}
.route-no{
  font-size:38px;
  font-weight:900;
  line-height:1;
  background:#00838f;
  color:#fff;
  padding:8px 16px;
  border-radius:14px;
  min-width:110px;
  text-align:center;
  flex:none;
}
.route-dest{
  font-size:32px;
  font-weight:800;
  color:#1e293b;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  flex:1 1 auto;
  min-width:0;
}
.etas{
  display:flex;
  gap:12px;
  margin-left:auto;
  flex:none;
  align-items:center;
}
.eta{
  background:#f1f5f9;
  border-radius:14px;
  padding:6px 14px;
  text-align:center;
  min-width:165px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  flex:none;
}
.eta-clock{
  font-size:22px;
  font-weight:800;
  color:#64748b;
  line-height:1.15;
  white-space:nowrap;
}
.eta-min{
  font-size:34px;
  font-weight:900;
  color:#2563eb;
  line-height:1.1;
  white-space:nowrap;
}
.no-bus{
  display:flex;
  align-items:center;
  justify-content:center;
  height:100%;
  color:#94a3b8;
  font-weight:800;
  font-size:28px;
}

/* 底部走馬燈 */
footer{
  display:flex;
  align-items:center;
  background:#fff;
  border:2px solid #cbd5e1;
  overflow:hidden;
}
.tag{
  height:100%;
  width:340px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  flex:none;
  background:#bd3c28;
  color:#fff;
  border-right:4px solid #8e2719;
  font-weight:900;
  line-height:1;
  z-index:2;
  position:relative;
  padding:6px 12px;
}
.rthk{font-size:30px;letter-spacing:1px}

/* 速度切換按鈕 */
.speed-toggle-btn{
  margin-top:8px;
  background:rgba(255,255,255,0.22);
  border:2px solid rgba(255,255,255,0.6);
  color:#fff;
  padding:6px 16px;
  border-radius:10px;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  transition:all 0.15s ease;
  user-select:none;
}
.speed-toggle-btn:hover{
  background:rgba(255,255,255,0.35);
  border-color:#fff;
  transform:scale(1.03);
}
.speed-toggle-btn:active{
  transform:scale(0.97);
}

.marquee-wrap{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  position:relative;
  display:flex;
  align-items:center;
}
.marquee{
  display:inline-block;
  white-space:nowrap;
  font-size:38px;
  font-weight:800;
  color:#0f172a;
  will-change:transform;
}

@keyframes rollPhysical {
  0% { transform: translateX(var(--start-x, 1800px)); }
  100% { transform: translateX(var(--end-x, -2400px)); }
}
</style>
</head>
<body>

<div id="stage-wrapper">
  <div id="app-scaler">
    <header>
      <div class="header-row">
        <div class="school-name">香港神託會培敦中學</div>
        <div class="date-time-box">
          <div class="date" id="date">--年--月--日</div>
          <div class="time" id="time">--:--:--</div>
        </div>
      </div>
    </header>
    <main>
      <!-- 左側 50%：氣象數據 (具備獨立自適應縮放，確保永不撐大破版) -->
      <section class="card">
        <div class="head">
          <span>☀️ 即時校園氣象數據</span>
        </div>
        <div class="weather">
          <!-- 第 1 格：左側氣溫 + 右側動態自適應條狀卡片 -->
          <div class="hero-container">
            <!-- 左側氣溫：大字強化 (支援防溢出縮放與漸進色) -->
            <div class="naked-temp-zone">
              <span class="naked-temp-label">即時氣溫</span>
              <div class="naked-temp-val" id="temp">--.-°C</div>
              <span class="naked-temp-sub">黃大仙氣象站</span>
            </div>

            <!-- 右側動態卡片容器 -->
            <div class="two-rows-container" id="two-rows-container">
              <!-- 行 1：即時純文字 + 天氣 Emoji（允許換行，超長時自動等比縮小至完整容納） -->
              <div class="info-row-card is-expanded" id="wx-card">
                <span class="row-label-tag">即時</span>
                <div class="row-wx-content" id="wx-box">
                  <span class="row-wx-emoji" id="wx-emoji">🌤️</span>
                  <span class="row-wx-text" id="desc">載入中</span>
                </div>
              </div>

              <!-- 行 2：生效警告信號（無警告時完全隱藏，多警告時自動等比縮小） -->
              <div class="info-row-card" id="warn-card" style="border-color:#fed7aa; display:none;">
                <div class="row-warn-content" id="warn-list"></div>
              </div>
            </div>
          </div>

          <!-- 第 2 格：相對濕度 與 這刻降雨狀況 (兩小格平分 1:1) -->
          <div class="two-cols-grid">
            <div class="metric-card">
              <span class="label">相對濕度</span>
              <span class="value" id="hum">--%</span>
              <span class="sub">即時環境濕度監測</span>
            </div>
            <div class="metric-card">
              <span class="label">這刻降雨狀況</span>
              <span class="value" id="rain">0.0 mm</span>
              <span class="sub">過去一小時累積雨量</span>
            </div>
          </div>

          <!-- 第 3 格：下一個小時降雨機率 與 空氣質素 (AQHI) (兩小格平分 1:1) -->
          <div class="two-cols-grid">
            <div class="metric-card">
              <span class="label">下一個小時降雨機率</span>
              <span class="value" id="next" style="color:#0284c7">分析中...</span>
              <span class="sub">預報源：香港天文台天色分析</span>
            </div>
            <div class="metric-card">
              <span class="label">空氣質素健康指數 (AQHI)</span>
              <div class="aqhi-card-content" id="aqhi-box">
                <span class="value" id="aqhi-val" style="color:#22c55e">--</span>
                <span class="aqhi-badge" id="aqhi-level" style="background:#22c55e">--</span>
              </div>
              <span class="sub" id="aqhi-station">觀塘 (一般監測站)</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 右側 50%：巴士到站時間 (具備主動防撐大自適應縮小機制) -->
      <section class="card bus-card">
        <div class="head"><span>🚌 巴士到站時間</span><span class="badge" id="bs">即時刷新</span></div>
        <div class="bus-view">
          <!-- 站 1：真鐸學校 -->
          <div class="bus-group">
            <div class="bus-title">🚏 真鐸學校</div>
            <div class="route-list" id="s1"></div>
          </div>
          <!-- 站 2：斧山道運動場 -->
          <div class="bus-group">
            <div class="bus-title">🚏 斧山道運動場</div>
            <div class="route-list" id="s2"></div>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <div class="tag" id="tag">
        <span class="rthk">RTHK 即時新聞</span>
        <button class="speed-toggle-btn" id="speed-btn" title="點擊切換走馬燈速度">
          <span>⏱️ 速度:</span>
          <span id="speed-label">標準 (285秒)</span>
        </button>
      </div>
      <div class="marquee-wrap" id="marquee-wrap">
        <div class="marquee" id="marquee">香港神託會培敦中學即時氣象與交通系統運行中</div>
      </div>
    </footer>
  </div>
</div>

<script>
const $=id=>document.getElementById(id),
      K='https://data.etabus.gov.hk/v1/transport/kmb',
      HKO_WEATHER='https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc',

/* 安全存儲封裝 */

      return localStorage.getItem(k);
    } catch (e) { return null; }
  },
  async set(k, v) {

      if (window.sayoStorage) return await window.sayoStorage.setItem(k, String(v));
      localStorage.setItem(k, String(v));
    } catch (e) {}

/* 2160x1620 (4:3) 自動適應縮放 */
function autoScale() {
  const scaler = $('app-scaler');
  const stage = $('stage-wrapper');
  if (!scaler || !stage) return;
  
  const availW = window.innerWidth;
  const availH = window.innerHeight;
  const scale = Math.min(availW / 2160, availH / 1620);
  
  scaler.style.transform = `scale(${scale})`;
  stage.style.width = availW + 'px';
  stage.style.height = availH + 'px';
}

window.addEventListener('resize', autoScale);
window.addEventListener('orientationchange', () => setTimeout(autoScale, 150));
window.addEventListener('load', autoScale);
autoScale();

async function get(u){
  let r=await fetch(u);
  if(!r.ok) throw Error();
  return r.json();
}

function clock(){
  let n=new Date,w='日一二三四五六';
  $('date').textContent=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日 (${w[n.getDay()]})`;
  $('time').textContent=`${n.getHours()>=12?'下午':'上午'}${String(n.getHours()%12||12).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;
}

/* ================= 單一數值文字防溢出縮小演算法 ================= */
function autoFitSingleText(el, maxPt, minPt) {
  if (!el) return;
  let size = maxPt;
  el.style.fontSize = size + 'px';
  while ((el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth) && size > minPt) {
    size -= 2;
    el.style.fontSize = size + 'px';
  }
}

/* ================= 即時天況描述字（支援換行至下一行 + 自適應縮小至 100% 容納） ================= */
function adjustWeatherTextAndEmoji(isExpanded) {
  const textEl = $('desc');
  const emojiEl = $('wx-emoji');
  const box = $('wx-box');
  const card = $('wx-card');
  if (!textEl || !emojiEl || !box || !card) return;

  // 根據展開或收合狀態給予最佳初始字級
  let textPt = isExpanded ? 52 : 40;
  let emojiPt = isExpanded ? 76 : 56;
  const minTextPt = 16;  // 最低保底字級
  const minEmojiPt = 28;

  textEl.style.fontSize = textPt + 'px';
  emojiEl.style.fontSize = emojiPt + 'px';

  // 檢測是否溢出（高度超出卡片或寬度超出容器）：如換行後仍未能完全顯示，自動逐級等比縮小
  let guard = 0;
  while (guard < 45 && (box.scrollHeight > box.clientHeight || box.scrollWidth > box.clientWidth || textEl.scrollHeight > card.clientHeight - 16) && textPt > minTextPt) {
    guard++;
    textPt -= 1.5;
    if (emojiPt > minEmojiPt && guard % 2 === 0) {
      emojiPt -= 2;
    }
    textEl.style.fontSize = textPt + 'px';
    emojiEl.style.fontSize = emojiPt + 'px';
  }
}

/* ================= 巴士到站卡片專屬防撐大自適應縮放演算法 ================= */
function autoFitBusRows() {
  const routes = document.querySelectorAll('.route');
  routes.forEach(route => {
    const routeNo = route.querySelector('.route-no');
    const routeDest = route.querySelector('.route-dest');
    const etaClocks = route.querySelectorAll('.eta-clock');
    const etaMins = route.querySelectorAll('.eta-min');
    const etas = route.querySelectorAll('.eta');

    let noSize = 38;
    let destSize = 32;
    let minSize = 34;
    let clockSize = 22;
    let etaMinWidth = 165;

    let count = 0;
    while ((route.scrollWidth > route.clientWidth || (route.parentElement && route.parentElement.scrollHeight > route.parentElement.clientHeight)) && count < 8) {
      count++;
      if (destSize > 22) destSize -= 2;
      if (noSize > 28) noSize -= 2;
      if (minSize > 26) minSize -= 1;
      if (clockSize > 18) clockSize -= 1;
      if (etaMinWidth > 140) etaMinWidth -= 4;

      if (routeNo) routeNo.style.fontSize = noSize + 'px';
      if (routeDest) routeDest.style.fontSize = destSize + 'px';
      etaMins.forEach(el => el.style.fontSize = minSize + 'px');
      etaClocks.forEach(el => el.style.fontSize = clockSize + 'px');
      etas.forEach(el => el.style.minWidth = etaMinWidth + 'px');
    }
  });
}

/* ================= 氣象與環境數據整合 (每 5 分鐘 / 300 秒自動刷新) ================= */
async function updateEnvironmentData(){
  try {
    const d = await get(HKO_WEATHER);
    let t = d.temperature.data.find(x => x.place === '黃大仙') || d.temperature.data[0];
    let numVal = typeof t.value === 'number' ? t.value : parseFloat(t.value);
    let tempNum = numVal.toFixed(1);
    
    const tempEl = $('temp');
    tempEl.textContent = `${tempNum}°C`;
    
    const tempColor = getTempColor(numVal);
    tempEl.style.color = tempColor;
    tempEl.style.textShadow = `0 4px 16px ${tempColor}40`;
    
    autoFitSingleText(tempEl, 132, 84);

    let iconNum = (d.icon && d.icon[0]) || 50;
    let wxInfo = WX_ICON_MAP[iconNum] || { desc: "大致天晴", emoji: "🌤️" };
    $('desc').textContent = wxInfo.desc;
    $('wx-emoji').textContent = wxInfo.emoji;

    $('hum').textContent = (d.humidity?.data[0]?.value || '--') + '%';
    autoFitSingleText($('hum'), 82, 54);

    let q = d.rainfall.data.find(x => x.place === '黃大仙');
    let r = q?.max || 0;
    $('rain').textContent = parseFloat(r).toFixed(1) + ' mm';
    autoFitSingleText($('rain'), 82, 54);

    $('next').textContent = r >= 10 ? '高' : (r > 0 ? '中' : '低');
    autoFitSingleText($('next'), 82, 54);

    await updateWarnings();
    await updateAQHI();

    const isExpanded = $('wx-card').classList.contains('is-expanded');
    adjustWeatherTextAndEmoji(isExpanded);

  } catch(e) {
    console.warn('天氣數據更新失敗，保留上次數值', e);
  }
}

async function updateWarnings(){
  const list = $('warn-list');
  const warnCard = $('warn-card');
  const wxCard = $('wx-card');

  try {
    const warnData = await get(HKO_WARN);
    const activeKeys = Object.keys(warnData || {});
    const currentHash = JSON.stringify(activeKeys.map(k => warnData[k].code));

    if (currentHash === lastWarnHash) return;
    lastWarnHash = currentHash;

    if (activeKeys.length === 0) {
      warnCard.style.display = 'none';
      wxCard.classList.add('is-expanded');
      list.innerHTML = '';
      adjustWeatherTextAndEmoji(true);
      return;
    }

    warnCard.style.display = 'flex';
    wxCard.classList.remove('is-expanded');

    const count = activeKeys.length;
    let textFontSize = count >= 3 ? 24 : (count === 2 ? 30 : 36);
    let iconHeight = count >= 3 ? 40 : (count === 2 ? 48 : 58);
    let itemPad = count >= 3 ? '6px 12px' : (count === 2 ? '8px 16px' : '10px 22px');

    const items = activeKeys.slice(0, 4).map(code => {
      const item = warnData[code];
      const name = item.name || item.type || '天氣警告';
      const itemCode = item.code || '';
      const fallbackEmoji = WARN_EMOJIS[itemCode] || '⚠️';
      const iconUrl = `https://www.hko.gov.hk/images/HKOWxIcon/${itemCode.toLowerCase()}.gif`;

      return `
        <div class="warn-strip-item" style="padding:${itemPad};" title="${name}">
          <div class="warn-strip-icon-box">
            <img src="${iconUrl}" 
                 style="height:${iconHeight}px;"
                 onerror="this.onerror=null; this.style.display='none'; this.nextElementSibling.style.display='inline-block';" 
                 alt="${name}">
            <span style="display:none; font-size:${textFontSize + 4}px; line-height:1;">${fallbackEmoji}</span>
          </div>
          <span class="warn-strip-text" style="font-size:${textFontSize}px;">${name}</span>
        </div>
      `;
    });

    list.innerHTML = items.join('');
    adjustWeatherTextAndEmoji(false);

  } catch(e) {
    if (lastWarnHash !== 'empty') {
      lastWarnHash = 'empty';
      warnCard.style.display = 'none';
      wxCard.classList.add('is-expanded');
      list.innerHTML = '';
      adjustWeatherTextAndEmoji(true);
    }
  }
}

/* ================= 觀塘區實時空氣質素 AQHI (參考官方 DATA.GOV.HK 規範) ================= */
async function updateAQHI(){
  let data = null;
  
  // 1. 呼叫官方 DATA.GOV.HK API 網址 (主端點: dashboard.data.gov.hk)
  try {
    data = await get(DASHBOARD_AQHI_URL);
  } catch(e) {
    // 備援端點 (api.data.gov.hk Filter API)
    try {
      const raw = await get(FILTER_AQHI_URL);
      data = Array.isArray(raw) ? raw : (raw.records || raw.data || []);
    } catch(e2) {
      console.warn('AQHI API 連線異常:', e2);
    }
  }

  if (Array.isArray(data) && data.length > 0) {
    // 2. 尋找 station 名稱為 "觀塘" 的數據
    const kwunTongData = data.find(item => {
      const st = (item && item.station) ? String(item.station).trim() : '';
      return st === '觀塘' || st.includes('觀塘') || st.toLowerCase().includes('kwun tong');
    });

    // 3. 處理並顯示結果
    if (kwunTongData) {
      const aqhiRaw = kwunTongData.aqhi ?? kwunTongData.aqhi_value ?? '3';
      const valStr = String(aqhiRaw).trim();
      const numVal = parseInt(valStr.replace('+', ''), 10) || 3;
      
      const theme = AQHI_THEMES.find(t => numVal <= t.max) || AQHI_THEMES[0];
      
      let levelText = kwunTongData.health_risk || kwunTongData.healthRisk || theme.label;
      const riskMap = { 'Low': '低', 'Moderate': '中', 'High': '高', 'Very High': '甚高', 'Serious': '嚴重' };
      if (riskMap[levelText]) levelText = riskMap[levelText];

      $('aqhi-val').textContent = valStr;
      $('aqhi-val').style.color = theme.bg;
      $('aqhi-level').textContent = levelText;
      $('aqhi-level').style.background = theme.bg;
      $('aqhi-station').textContent = '觀塘 (一般監測站)';
      autoFitSingleText($('aqhi-val'), 82, 54);
      return;
    }
  }
  
  // 默認保底顯示
  $('aqhi-val').textContent = '3';
  $('aqhi-level').textContent = '低';
  $('aqhi-level').style.background = '#22c55e';
  $('aqhi-station').textContent = '觀塘 (一般監測站)';
}

/* ================= 巴士 ETA 到站模組 ================= */
async function allRoutes(){
  if(routes&&Date.now()-stamp<12e4)return routes;
  routes=(await get(K+'/route/')).data;
  stamp=Date.now();
  return routes;
}

let groups=[
  ['s1',[['3D','觀塘','慈雲山','往 慈雲山(中)',10],['3M','彩雲','慈雲山','往 慈雲山(北)',5],['203E','彩虹','九龍站','往 九龍站',2]]],
  ['s2',[['3D','慈雲山','觀塘','往 觀塘(裕民坊)',8],['3M','慈雲山','彩雲','往 彩雲',8],['203E','九龍站','彩虹','往 彩虹',25]]]
];

function tm(x){
  let d=new Date(x),h=d.getHours();
  return`${h>=12?'下午':'上午'}${String(h%12||12).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

async function eta(c){
  try{
    let r=(await allRoutes()).find(x=>x.route===c[0]&&x.orig_tc.includes(c[1])&&x.dest_tc.includes(c[2]));
    if(!r)return[];
    let b=r.bound==='O'?'outbound':'inbound',k=c[0]+b+c[4],p=stops[k]||(stops[k]=(await get(`${K}/route-stop/${c[0]}/${b}/1`)).data.find(x=>+x.seq===c[4])?.stop);
    return p?(await get(`${K}/eta/${p}/${c[0]}/1`)).data.filter(x=>x.eta&&x.dir===r.bound&&new Date(x.eta)>Date.now()-3e4).sort((a,b)=>new Date(a.eta)-new Date(b.eta)).slice(0,2):[]
  }catch(e){
    return[];
  }
}

function row(c,a){
  let z=a.map(x=>{
    let m=Math.max(0,Math.round((new Date(x.eta)-Date.now())/6e4));
    return`<div class="eta"><div class="eta-clock">${tm(x.eta)}</div><div class="eta-min">${m?m+'分鐘':'即將到達'}</div></div>`;
  }).join('')||'<div class="no-bus">暫無即時班次</div>';
  return`<div class="route"><div class="route-meta"><div class="route-no">${c[0]}</div><div class="route-dest">${c[3]}</div></div><div class="etas">${z}</div></div>`;
}

async function buses(){
  await Promise.all(groups.map(async([id,a])=>$(id).innerHTML=(await Promise.all(a.map(eta))).map((x,i)=>row(a[i],x)).join('')));
  $('bs').textContent='更新於 '+new Date().toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'});
  autoFitBusRows();
}

/* ================= 走馬燈播放控制器 ================= */
function renderMarquee() {
  const m = $('marquee');
  const wrap = $('marquee-wrap');
  if (!m || !wrap) return;

  m.textContent = currentNewsText;
  const currentMode = SPEED_MODES[currentSpeedIndex];
  $('speed-label').textContent = currentMode.label;

  const wrapW = wrap.clientWidth || 1800;
  const textW = m.scrollWidth || (currentNewsText.length * 38);
  
  m.style.setProperty('--start-x', wrapW + 'px');
  m.style.setProperty('--end-x', (-textW - 120) + 'px');
  
  m.style.animation = 'none';
  m.offsetHeight;
  m.style.animation = `rollPhysical ${currentMode.sec}s linear infinite`;
}

/* 速度切換與持久化 */
$('speed-btn').addEventListener('click', async () => {
  currentSpeedIndex = (currentSpeedIndex + 1) % SPEED_MODES.length;
  renderMarquee();
  await safeStore.set('saved_speed_index', currentSpeedIndex);
});

async function initSavedSpeed() {
  const savedIdx = await safeStore.get('saved_speed_index');
  if (savedIdx !== null && !isNaN(savedIdx)) {
    const idx = parseInt(savedIdx, 10);
    if (idx >= 0 && idx < SPEED_MODES.length) {
      currentSpeedIndex = idx;
    }
  }
  renderMarquee();
}

async function fetchNews(){
  try{
    let r=await fetch('./news.json?t='+Date.now());
    if(!r.ok)throw Error();
    let data=await r.json();
    if(data&&data.length>0){
      currentNewsText = data.join('  ✦  ');
      renderMarquee();
      return;
    }
  }catch(e){}
  currentNewsText = '香港神託會培敦中學即時氣象與交通系統運行中';
  renderMarquee();
}

/* 初始化執行 */
clock();
updateEnvironmentData();
buses();
initSavedSpeed();
fetchNews();

/* 嚴格定時器設定 */
setInterval(clock, 1000);                     // 時鐘每 1 秒更新
setInterval(buses, 20000);                    // 巴士 ETA 每 20 秒更新
setInterval(updateEnvironmentData, 300000);   // 天氣、警告與 AQHI 每 5 分鐘 (300 秒) 自動更新
setInterval(fetchNews, 900000);                // 新聞每 15 分鐘更新
</script>
