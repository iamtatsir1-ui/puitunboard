<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>香港神託會培敦中學 - 校園氣象與交通儀表板</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#0f172a}

/* 容器視窗：保持標準 16:9 (1920x1080) 基準並根據屏幕自動縮放與居中 */
#app-scaler{
  width:1920px;
  height:1080px;
  position:absolute;
  top:50%;
  left:50%;
  transform-origin:center center;
  display:grid;
  grid-template-rows:80px 1fr 90px;
  gap:16px;
  padding:20px;
  background:#f8fafc radial-gradient(#cbd5e1 1.5px,transparent 1.5px);
  background-size:24px 24px;
  color:#1e293b;
}

header,.card,footer{
  background:#ffffffef;
  border-radius:20px;
  box-shadow:0 6px 24px rgba(0,0,0,0.06);
  backdrop-filter:blur(10px);
}

/* 頂部導覽列 */
header{
  padding:0 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.header-row{
  display:flex;
  align-items:center;
  gap:20px;
  width:100%;
}
.school-name{
  font-size:32px;
  font-weight:900;
  color:#fff;
  letter-spacing:.04em;
  -webkit-text-stroke:1.2px #0369a1;
  text-shadow:-2px -2px #0284c7, 2px -2px #0284c7, -2px 2px #0284c7, 2px 2px #0284c7;
  padding-right:20px;
  border-right:3px solid #cbd5e1;
}
.date-time-box{
  display:flex;
  align-items:center;
  gap:16px;
  margin-left:auto;
}
.date{font-size:28px;font-weight:800;color:#e11d48}
.time{font-size:32px;font-weight:900;color:#0284c7;font-variant-numeric:tabular-nums}

/* 主體佈局：平分左右 (1fr 1fr) */
main{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  min-height:0;
}
.card{
  padding:22px;
  display:flex;
  flex-direction:column;
  min-height:0;
}
.head{
  font-size:24px;
  font-weight:800;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:12px;
  border-bottom:2px dashed #e2e8f0;
}
.badge{
  font-size:16px;
  font-weight:700;
  padding:4px 14px;
  border-radius:12px;
  background:#f1f5f9;
  color:#64748b;
}

/* 氣象卡片 (左側 50%)：三個區塊 1:1:1 等高平分 */
.weather{
  flex:1;
  padding-top:16px;
  display:grid;
  grid-template-rows:1fr 1fr 1fr;
  gap:16px;
  min-height:0;
}

/* 第 1 格：即時氣溫與天色 */
.hero{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(135deg,#eff6ff 0%,#dbeafe 100%);
  padding:0 32px;
  border-radius:20px;
  border:1.5px solid #bfdbfe;
  height:100%;
}
.temp{font-size:86px;font-weight:900;line-height:1;color:#1d4ed8}
.desc{
  font-size:32px;
  font-weight:900;
  background:#fff;
  color:#0369a1;
  padding:14px 28px;
  border-radius:18px;
  box-shadow:0 4px 12px rgba(3,105,161,0.12);
  border:1px solid #e0f2fe;
}

/* 第 2 格：濕度與這刻降雨狀況 (兩小格平分) */
.rain-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  height:100%;
}
.rain-card{
  background:#f8fafc;
  border:1.5px solid #e2e8f0;
  border-radius:20px;
  padding:0 24px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:6px;
  height:100%;
}
.label{font-size:22px;font-weight:800;color:#64748b}
.value{font-size:44px;font-weight:900;color:#0f172a;line-height:1.1}
.sub{font-size:16px;font-weight:600;color:#94a3b8}

/* 第 3 格：下一個小時降雨機率 */
.future-rain-card{
  background:#f8fafc;
  border:1.5px solid #e2e8f0;
  border-radius:20px;
  padding:0 28px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:6px;
  height:100%;
}
.future-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.future-val{
  font-size:46px;
  font-weight:900;
  color:#0284c7;
  line-height:1.1;
}

/* 巴士到站卡片 (右側 50%)：兩個站表格平分上下 (1:1 等高) */
.bus-view{
  flex:1;
  display:grid;
  grid-template-rows:1fr 1fr;
  gap:16px;
  padding-top:16px;
  min-height:0;
}
.bus-group{
  background:#f8fafc;
  padding:14px 18px;
  border:1.5px solid #e2e8f0;
  border-radius:20px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-height:0;
  height:100%;
}
.bus-title{
  font-size:22px;
  font-weight:900;
  color:#1e293b;
  display:flex;
  align-items:center;
  gap:10px;
  padding-bottom:6px;
  border-bottom:1px solid #e2e8f0;
  flex:none;
}
.route-list{
  flex:1;
  display:grid;
  grid-template-rows:1fr 1fr 1fr;
  gap:8px;
  min-height:0;
  padding-top:8px;
}
.route{
  background:#fff;
  border-radius:14px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 2px 6px rgba(0,0,0,0.03);
  border:1px solid #f1f5f9;
  height:100%;
  min-height:0;
}
.route-meta{
  display:flex;
  align-items:center;
  gap:16px;
  min-width:0;
}
.route-no{
  font-size:28px;
  font-weight:900;
  line-height:1;
  background:#00838f;
  color:#fff;
  padding:6px 14px;
  border-radius:10px;
  min-width:96px;
  text-align:center;
  flex:none;
}
.route-dest{
  font-size:22px;
  font-weight:800;
  color:#1e293b;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.etas{
  display:flex;
  gap:12px;
  margin-left:auto;
  flex:none;
}
.eta{
  background:#f1f5f9;
  border-radius:10px;
  padding:6px 14px;
  text-align:center;
  min-width:118px;
}
.eta-clock{font-size:17px;font-weight:800;color:#64748b}
.eta-min{font-size:23px;font-weight:900;color:#2563eb;line-height:1.1}
.no-bus{
  display:flex;
  align-items:center;
  justify-content:center;
  height:100%;
  color:#94a3b8;
  font-weight:800;
  font-size:18px;
}

/* 底部走馬燈 */
footer{
  display:flex;
  align-items:center;
  background:#fff;
  border:1px solid #cbd5e1;
  overflow:hidden;
}
.tag{
  height:100%;
  width:260px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  flex:none;
  background:#bd3c28;
  color:#fff;
  border-right:3px solid #8e2719;
  font-weight:900;
  line-height:1;
  z-index:2;
  position:relative;
  padding:4px 8px;
}
.rthk{font-size:24px;letter-spacing:1px}

/* 單鍵速度切換按鈕 */
.speed-toggle-btn{
  margin-top:5px;
  background:rgba(255,255,255,0.22);
  border:1.5px solid rgba(255,255,255,0.6);
  color:#fff;
  padding:4px 12px;
  border-radius:8px;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  transition:all 0.15s ease;
  user-select:none;
}
.speed-toggle-btn:hover{
  background:rgba(255,255,255,0.35);
  border-color:#fff;
  transform:scale(1.03);
}
.speed-toggle-btn:active{
  transform:scale(0.97);
}

.marquee-wrap{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  position:relative;
  display:flex;
  align-items:center;
}
.marquee{
  display:inline-block;
  white-space:nowrap;
  font-size:30px;
  font-weight:800;
  color:#0f172a;
  will-change:transform;
}

@keyframes rollPhysical {
  0% {
    transform: translateX(var(--start-x, 1600px));
  }
  100% {
    transform: translateX(var(--end-x, -2000px));
  }
}
</style>
</head>
<body>

<div id="app-scaler">
  <header>
    <div class="header-row">
      <div class="school-name">香港神託會培敦中學</div>
      <div class="date-time-box">
        <div class="date" id="date">--年--月--日</div>
        <div class="time" id="time">--:--:--</div>
      </div>
    </div>
  </header>
  <main>
    <!-- 左側 50%：氣象數據 (3個等高格 1:1:1) -->
    <section class="card">
      <div class="head"><span>☀️ 即時校園氣象數據</span><span class="badge" id="station">黃大仙站</span></div>
      <div class="weather">
        <!-- 第 1 格：氣溫與天況 -->
        <div class="hero">
          <div class="temp" id="temp">--°C</div>
          <div><div class="desc" id="desc">載入中</div></div>
        </div>

        <!-- 第 2 格：濕度與這刻降雨狀況 (兩小格平分) -->
        <div class="rain-grid">
          <div class="rain-card">
            <span class="label">相對濕度</span>
            <span class="value" id="hum">--%</span>
          </div>
          <div class="rain-card">
            <span class="label">這刻降雨狀況</span>
            <span class="value" id="rain">0 mm</span>
            <span class="sub">過去一小時雨量</span>
          </div>
        </div>

        <!-- 第 3 格：下一個小時降雨機率 -->
        <div class="future-rain-card">
          <div class="future-header">
            <span class="label">下一個小時降雨機率</span>
            <span class="future-val" id="next">分析中...</span>
          </div>
          <span class="sub">預報源：天文台天色分析</span>
        </div>
      </div>
    </section>

    <!-- 右側 50%：巴士到站時間 (兩個表格平分上下 1:1 等高) -->
    <section class="card bus-card">
      <div class="head"><span>🚌 巴士到站時間</span><span class="badge" id="bs">即時刷新</span></div>
      <div class="bus-view">
        <!-- 站 1：真鐸學校 -->
        <div class="bus-group">
          <div class="bus-title">🚏 真鐸學校</div>
          <div class="route-list" id="s1"></div>
        </div>
        <!-- 站 2：斧山道運動場 -->
        <div class="bus-group">
          <div class="bus-title">🚏 斧山道運動場</div>
          <div class="route-list" id="s2"></div>
        </div>
      </div>
    </section>
  </main>
  <footer>
    <div class="tag" id="tag">
      <span class="rthk">RTHK 即時新聞</span>
      <button class="speed-toggle-btn" id="speed-btn" title="點擊切換走馬燈速度">
        <span>⏱️ 速度:</span>
        <span id="speed-label">標準 (285秒)</span>
      </button>
    </div>
    <div class="marquee-wrap" id="marquee-wrap">
      <div class="marquee" id="marquee">香港神託會培敦中學即時氣象與交通系統運行中</div>
    </div>
  </footer>
</div>

<script>
const $=id=>document.getElementById(id),
      K='https://data.etabus.gov.hk/v1/transport/kmb',
      H='https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc';
let routes, stamp=0, stops={};
let currentNewsText = '香港神託會培敦中學即時氣象與交通系統運行中';

/* 預設 4 段常用循環速度檔位：按一下自動輪換 */
const SPEED_MODES = [
  { label: '標準 (285秒)', sec: 285 }, // 570字 每秒2字
  { label: '舒適慢速 (380秒)', sec: 380 }, // 每秒1.5字
  { label: '適中 (190秒)', sec: 190 }, // 每秒3字
  { label: '快速 (100秒)', sec: 100 }
];
let currentSpeedIndex = 0;

/* 安全存儲封裝 */
const safeStore = {
  async get(k) {
    try {
      if (window.sayoStorage) return await window.sayoStorage.getItem(k);
      return localStorage.getItem(k);
    } catch (e) { return null; }
  },
  async set(k, v) {
    try {
      if (window.sayoStorage) return await window.sayoStorage.setItem(k, String(v));
      localStorage.setItem(k, String(v));
    } catch (e) {}
  }
};

/* 自動全屏等比縮放適配（支援 1080p、4K、平板、窄屏等任何電視/顯示器） */
function autoScale() {
  const scaler = document.getElementById('app-scaler');
  const baseW = 1920;
  const baseH = 1080;
  const winW = window.innerWidth;
  const winH = window.innerHeight;
  const scale = Math.min(winW / baseW, winH / baseH);
  scaler.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

window.addEventListener('resize', autoScale);
window.addEventListener('load', autoScale);
autoScale();

async function get(u){let r=await fetch(u);if(!r.ok)throw Error();return r.json()}

function clock(){
  let n=new Date,w='日一二三四五六';
  $('date').textContent=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日 (${w[n.getDay()]})`;
  $('time').textContent=`${n.getHours()>=12?'下午':'上午'}${String(n.getHours()%12||12).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;
}

async function weather(){
  try{
    let d=await get(H),t=d.temperature.data.find(x=>x.place==='黃大仙')||d.temperature.data[0],q=d.rainfall.data.find(x=>x.place==='黃大仙'),r=q?.max||0;
    $('temp').textContent=t.value+'°C';
    $('hum').textContent=d.humidity.data[0].value+'%';
    $('rain').textContent=r+' mm';
    $('desc').textContent=r?'有驟雨':'大致天晴';
    $('next').textContent=r>=10?'高':r?'中':'低';
    $('station').textContent=t.place+'站';
  }catch(e){
    $('station').textContent='數據連線中...'
  }
}

async function allRoutes(){
  if(routes&&Date.now()-stamp<12e4)return routes;
  routes=(await get(K+'/route/')).data;
  stamp=Date.now();
  return routes
}

let groups=[
  ['s1',[['3D','觀塘','慈雲山','往 慈雲山(中)',10],['3M','彩雲','慈雲山','往 慈雲山(北)',5],['203E','彩虹','九龍站','往 九龍站',2]]],
  ['s2',[['3D','慈雲山','觀塘','往 觀塘(裕民坊)',8],['3M','慈雲山','彩雲','往 彩雲',8],['203E','九龍站','彩虹','往 彩虹',25]]]
];

function tm(x){
  let d=new Date(x),h=d.getHours();
  return`${h>=12?'下午':'上午'}${String(h%12||12).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`
}

async function eta(c){
  try{
    let r=(await allRoutes()).find(x=>x.route===c[0]&&x.orig_tc.includes(c[1])&&x.dest_tc.includes(c[2]));
    if(!r)return[];
    let b=r.bound==='O'?'outbound':'inbound',k=c[0]+b+c[4],p=stops[k]||(stops[k]=(await get(`${K}/route-stop/${c[0]}/${b}/1`)).data.find(x=>+x.seq===c[4])?.stop);
    return p?(await get(`${K}/eta/${p}/${c[0]}/1`)).data.filter(x=>x.eta&&x.dir===r.bound&&new Date(x.eta)>Date.now()-3e4).sort((a,b)=>new Date(a.eta)-new Date(b.eta)).slice(0,2):[]
  }catch(e){
    return[]
  }
}

function row(c,a){
  let z=a.map(x=>{
    let m=Math.max(0,Math.round((new Date(x.eta)-Date.now())/6e4));
    return`<div class="eta"><div class="eta-clock">${tm(x.eta)}</div><div class="eta-min">${m?m+'分鐘':'即將到達'}</div></div>`
  }).join('')||'<div class="no-bus">暫無即時班次</div>';
  return`<div class="route"><div class="route-meta"><div class="route-no">${c[0]}</div><div class="route-dest">${c[3]}</div></div><div class="etas">${z}</div></div>`
}

async function buses(){
  await Promise.all(groups.map(async([id,a])=>$(id).innerHTML=(await Promise.all(a.map(eta))).map((x,i)=>row(a[i],x)).join('')));
  $('bs').textContent='更新於 '+new Date().toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'});
}

/* ================= 走馬燈播放控制器 ================= */
function renderMarquee() {
  const m = $('marquee');
  const wrap = $('marquee-wrap');
  if (!m || !wrap) return;

  m.textContent = currentNewsText;
  
  const currentMode = SPEED_MODES[currentSpeedIndex];
  const duration = currentMode.sec;
  
  $('speed-label').textContent = currentMode.label;

  const wrapW = wrap.clientWidth || 1600;
  const textW = m.scrollWidth || (currentNewsText.length * 30);
  
  m.style.setProperty('--start-x', wrapW + 'px');
  m.style.setProperty('--end-x', (-textW - 100) + 'px');
  
  m.style.animation = 'none';
  m.offsetHeight;
  m.style.animation = `rollPhysical ${duration}s linear infinite`;
}

/* 單鍵點擊切換速度 */
$('speed-btn').addEventListener('click', async () => {
  currentSpeedIndex = (currentSpeedIndex + 1) % SPEED_MODES.length;
  renderMarquee();
  await safeStore.set('saved_speed_index', currentSpeedIndex);
});

async function initSavedSpeed() {
  const savedIdx = await safeStore.get('saved_speed_index');
  if (savedIdx !== null && !isNaN(savedIdx)) {
    const idx = parseInt(savedIdx, 10);
    if (idx >= 0 && idx < SPEED_MODES.length) {
      currentSpeedIndex = idx;
    }
  }
  renderMarquee();
}

async function fetchNews(){
  try{
    let r=await fetch('./news.json?t='+Date.now());
    if(!r.ok)throw Error();
    let data=await r.json();
    if(data&&data.length>0){
      currentNewsText = data.join('  ✦  ');
      renderMarquee();
      return;
    }
  }catch(e){}
  currentNewsText = '香港神託會培敦中學即時氣象與交通系統運行中';
  renderMarquee();
}

clock();
weather();
buses();
initSavedSpeed();
fetchNews();

setInterval(clock,1000);
setInterval(buses,20000);
setInterval(weather,300000);
setInterval(fetchNews,900000);
</script>
</body>
</html>
