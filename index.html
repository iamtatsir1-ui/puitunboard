<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>香港神託會培敦中學 - 校園氣象與交通儀表板</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--fit:1;--temp:calc(6.2rem * var(--fit));--top:calc(var(--temp)/3);--foot:12.9vh;--r:20px}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif}
body{height:100vh;padding:16px;overflow:hidden;display:grid;grid-template-rows:calc(var(--top) + 20px) minmax(0,1fr) var(--foot);gap:14px;background:#f8fafc radial-gradient(#cbd5e1 1px,transparent 1px);background-size:24px 24px;color:#1e293b}
header,.card,footer{background:#ffffffef;border-radius:var(--r);box-shadow:0 4px 20px #0000000d;overflow:hidden}
header{padding:8px 20px;display:flex;align-items:center}
.header-row{display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:0}
.school-name{font-size:var(--top);font-weight:900;line-height:1;color:#fff;letter-spacing:.04em;-webkit-text-stroke:1px #5e9ed5;text-shadow:-2px -2px #1264ab,2px -2px #1264ab,-2px 2px #1264ab,2px 2px #1264ab;padding:2px 12px 4px 1px;border-right:3px solid #cbd5e1}
.date,.time{font-size:var(--top);font-weight:900;line-height:1}
.date{color:#e11d48}
.time{color:#0284c7}
main{display:grid;grid-template-columns:1fr 1.15fr;gap:16px;min-height:0}
.card{padding:18px;display:flex;flex-direction:column;min-height:0}
.head{font-size:1.2rem;font-weight:800;display:flex;justify-content:space-between;gap:8px;padding-bottom:10px;border-bottom:2px dashed #e2e8f0;white-space:nowrap}
.badge{font-size:.82rem;padding:3px 10px;border-radius:12px;background:#f1f5f9;color:#64748b}
.weather{height:100%;padding-top:10px;display:flex;flex-direction:column;gap:10px;min-height:0}
.hero{display:flex;justify-content:space-between;align-items:flex-start}
.temp{font-size:var(--temp);font-weight:900;line-height:1;color:#2563eb}
.desc{font-size:1.2rem;font-weight:800;background:#e0f2fe;color:#0369a1;padding:6px 14px;border-radius:12px}
.rain-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:25%;flex:none;min-height:0}
.rain-card{--rf:1;background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:12px;display:flex;flex-direction:column;justify-content:center;gap:5px;overflow:hidden;min-height:0}
.weather>.rain-card{height:25%;flex:none}
.rain-card span{display:block;white-space:nowrap;line-height:1.08}
.label{font-size:calc(var(--top)*var(--rf));font-weight:700;color:#64748b}
.value{font-size:calc(var(--top)*var(--rf));font-weight:900;color:#0f172a}
.sub{font-size:calc(var(--top)*.45*var(--rf));color:#94a3b8}
.bus-card{--pf:1}
.bus-view{flex:1;min-height:0;overflow:hidden}
.bus-sections{display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:100%;transform:scale(var(--pf));transform-origin:top left;width:calc(100% / var(--pf))}
.bus-group{background:#f8fafc;padding:8px 10px;border:1px solid #e2e8f0;border-radius:16px}
.bus-title{font-size:1.05rem;font-weight:900;margin-bottom:6px}
.route{--rf:1;position:relative;height:calc(68px * var(--rf));overflow:hidden;background:#fff;border-radius:12px;margin-bottom:6px}
.route-inner{position:absolute;width:calc(100% / var(--rf));height:68px;padding:7px 10px;display:flex;align-items:center;gap:10px;white-space:nowrap;transform:scale(var(--rf));transform-origin:top left}
.route-meta{display:flex;align-items:center;gap:10px;min-width:0}
.route-no{font-size:clamp(1rem,2.9vw,2.2rem);font-weight:900;line-height:1;background:#00838f;color:#fff;padding:3px 7px;border-radius:8px}
.route-dest{font-size:calc(clamp(1rem,2.9vw,2.2rem)*.5);font-weight:900}
.etas{display:flex;gap:8px;margin-left:auto}
.eta{background:#f1f5f9;border-radius:10px;padding:4px 10px;text-align:center;min-width:100px}
.eta-clock{font-size:1.55rem;font-weight:900}
.eta-min{font-size:1.35rem;font-weight:900;color:#2563eb}
.no-bus{padding:8px;color:#94a3b8;font-weight:700;white-space:nowrap}
footer{display:flex;align-items:center;min-height:0;background:#fff;color:#000;border:1px solid #cbd5e1}
.tag{height:100%;width:200px;display:flex;flex-direction:column;justify-content:center;align-items:center;flex:none;background:#bd3c28;color:#fff;border-right:2px solid #8e2719;font-weight:900;line-height:1}
.rthk{font-size:calc(var(--foot)*.45)}
.news-label{font-size:calc(var(--foot)*.27);margin-top:2px}
.marquee-wrap{width:100%;overflow:hidden;white-space:nowrap}
.marquee{display:inline-block;padding-left:100%;animation:roll 15s linear infinite;font-size:calc(var(--foot)*.62);font-weight:800}
@keyframes roll{to{transform:translateX(-100%)}}
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div class="school-name">香港神託會培敦中學</div>
    <div class="date" id="date">--年--月--日</div>
    <div class="time" id="time">--:--:--</div>
  </div>
</header>
<main>
  <section class="card">
    <div class="head"><span>☀️ 即時校園氣象數據</span><span class="badge" id="station">黃大仙站</span></div>
    <div class="weather">
      <div class="hero">
        <div class="temp" id="temp">--°C</div>
        <div><div class="desc" id="desc">載入中</div></div>
      </div>
      <div class="rain-grid">
        <div class="rain-card"><span class="label">相對濕度</span><span class="value" id="hum">--%</span></div>
        <div class="rain-card"><span class="label">這刻降雨狀況</span><span class="value" id="rain">0 mm</span><span class="sub">過去一小時黃大仙雨量</span></div>
      </div>
      <div class="rain-card"><span class="label">下一個小時降雨機率</span><span class="value" id="next">分析中...</span><span class="sub">預報源：基於現時天色與雨量</span></div>
    </div>
  </section>
  <section class="card bus-card">
    <div class="head"><span>🚌 巴士到站時間</span><span class="badge" id="bs">即時刷新</span></div>
    <div class="bus-view">
      <div class="bus-sections">
        <div class="bus-group">
          <div class="bus-title">🚏 真鐸學校</div>
          <div id="s1"></div>
        </div>
        <div class="bus-group">
          <div class="bus-title">🚏 斧山道運動場</div>
          <div id="s2"></div>
        </div>
      </div>
    </div>
  </section>
</main>
<footer>
  <div class="tag" id="tag"><span class="rthk">NEWS</span><span class="news-label">即時新聞</span></div>
  <div class="marquee-wrap">
    <div class="marquee" id="marquee">香港神託會培敦中學即時氣象與交通系統運行中</div>
  </div>
</footer>
<script>
const $=id=>document.getElementById(id),K='https://data.etabus.gov.hk/v1/transport/kmb',H='https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc';
let routes,stamp=0,stops={};

async function get(u){let r=await fetch(u);if(!r.ok)throw Error();return r.json()}

function fit(){
  let h=document.querySelector('header'),r=document.querySelector('.header-row');
  document.documentElement.style.setProperty('--fit',1);
  document.documentElement.style.setProperty('--fit',Math.max(.15,Math.min(1,(h.clientWidth-40)/r.scrollWidth)).toFixed(3));
  $('tag').style.width=Math.max(125,document.querySelector('.bus-card').clientWidth*.33)+'px';
  document.querySelectorAll('.rain-card').forEach(c=>{
    let f=1;c.style.setProperty('--rf',f);
    for(let n=0;n<90&&(c.scrollWidth>c.clientWidth||c.scrollHeight>c.clientHeight);n++)c.style.setProperty('--rf',f=Math.max(.12,f-.01))
  });
  let v=document.querySelector('.bus-view'),s=document.querySelector('.bus-sections'),b=document.querySelector('.bus-card');
  b.style.setProperty('--pf',1);
  document.querySelectorAll('.route').forEach(x=>{
    let f=1,i=x.firstElementChild;
    for(let n=0;n<80&&i.scrollWidth>x.clientWidth/f;n++)f-=.02;
    x.style.setProperty('--rf',Math.max(.16,f))
  });
  b.style.setProperty('--pf',Math.max(.3,Math.min(1,v.clientHeight/s.scrollHeight)))
}

function clock(){
  let n=new Date,w='日一二三四五六';
  $('date').textContent=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日(${w[n.getDay()]})`;
  $('time').textContent=`${n.getHours()>=12?'下午':'上午'}${String(n.getHours()%12||12).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;
  fit()
}

async function weather(){
  try{
    let d=await get(H),t=d.temperature.data.find(x=>x.place==='黃大仙')||d.temperature.data[0],q=d.rainfall.data.find(x=>x.place==='黃大仙'),r=q?.max||0;
    $('temp').textContent=t.value+'°C';
    $('hum').textContent=d.humidity.data[0].value+'%';
    $('rain').textContent=r+' mm';
    $('desc').textContent=r?'有驟雨':'大致天晴';
    $('next').textContent=r>=10?'高':r?'中':'低';
    $('station').textContent=t.place+'站';
    fit()
  }catch(e){
    $('station').textContent='數據連線中...'
  }
}

async function allRoutes(){
  if(routes&&Date.now()-stamp<12e4)return routes;
  routes=(await get(K+'/route/')).data;
  stamp=Date.now();
  return routes
}

let groups=[['s1',[['3D','觀塘','慈雲山','往 慈雲山(中)',10],['3M','彩雲','慈雲山','往 慈雲山(北)',5],['203E','彩虹','九龍站','往 九龍站',2]]],['s2',[['3D','慈雲山','觀塘','往 觀塘(裕民坊)',8],['3M','慈雲山','彩雲','往 彩雲',8],['203E','九龍站','彩虹','往 彩虹',25]]]];

function tm(x){
  let d=new Date(x),h=d.getHours();
  return`${h>=12?'下午':'上午'}${String(h%12||12).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`
}

async function eta(c){
  try{
    let r=(await allRoutes()).find(x=>x.route===c[0]&&x.orig_tc.includes(c[1])&&x.dest_tc.includes(c[2]));
    if(!r)return[];
    let b=r.bound==='O'?'outbound':'inbound',k=c[0]+b+c[4],p=stops[k]||(stops[k]=(await get(`${K}/route-stop/${c[0]}/${b}/1`)).data.find(x=>+x.seq===c[4])?.stop);
    return p?(await get(`${K}/eta/${p}/${c[0]}/1`)).data.filter(x=>x.eta&&x.dir===r.bound&&new Date(x.eta)>Date.now()-3e4).sort((a,b)=>new Date(a.eta)-new Date(b.eta)).slice(0,2):[]
  }catch(e){
    return[]
  }
}

function row(c,a){
  let z=a.map(x=>{
    let m=Math.max(0,Math.round((new Date(x.eta)-Date.now())/6e4));
    return`<div class="eta"><div class="eta-clock">${tm(x.eta)}</div><div class="eta-min">${m?m+'分鐘':'即將到達'}</div></div>`
  }).join('')||'<div class="no-bus">暫無即時班次</div>';
  return`<div class="route"><div class="route-inner"><div class="route-meta"><div class="route-no">${c[0]}</div><div class="route-dest">${c[3]}</div></div><div class="etas">${z}</div></div></div>`
}

async function buses(){
  await Promise.all(groups.map(async([id,a])=>$(id).innerHTML=(await Promise.all(a.map(eta))).map((x,i)=>row(a[i],x)).join('')));
  $('bs').textContent='更新於 '+new Date().toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'});
  fit()
}

async function fetchNews(){
  try{
    let r=await fetch('./news.json?t='+Date.now());
    if(!r.ok)throw Error();
    let data=await r.json();
    if(data&&data.length>0){
      $('marquee').textContent=data.join(' ｜ ');
    }
  }catch(e){
    $('marquee').textContent='香港神託會培敦中學即時氣象與交通系統運行中';
  }
}

addEventListener('resize',fit);
clock();
weather();
buses();
fetchNews();

setInterval(clock,1000);
setInterval(buses,20000);
setInterval(weather,300000);
setInterval(fetchNews,900000);
</script>
</body>
</html>
