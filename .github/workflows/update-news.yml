name: Update News API Data

on:
  schedule:
    - cron: '*/15 * * * *' # 每 15 分鐘執行一次
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenCC
        run: npm install opencc-js

      - name: Fetch Chinese HK & International News
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          node -e '
          const fs = require("fs");
          const OpenCC = require("opencc-js");
          // 設定轉換規則：簡體/通用轉換為香港繁體 (hk)
          const converter = OpenCC.Converter({ from: "cn", to: "hk" });

          async function getNews() {
            const key = process.env.NEWS_API_KEY;
            try {
              // 1. 抓取香港本地新聞
              const hkRes = await fetch(`https://newsapi.org/v2/top-headlines?country=hk&pageSize=8&apiKey=${key}`);
              const hkData = await hkRes.json();

              // 2. 抓取中文版國際新聞 (language=zh)
              const zhRes = await fetch(`https://newsapi.org/v2/top-headlines?language=zh&pageSize=8&apiKey=${key}`);
              const zhData = await zhRes.json();

              let newsList = [];
              const seenTitles = new Set();

              // 處理香港本地新聞
              if (hkData.articles) {
                hkData.articles.forEach(a => {
                  if (a.title && !seenTitles.has(a.title)) {
                    seenTitles.add(a.title);
                    newsList.push(`【本地】${converter(a.title)}`);
                  }
                });
              }

              // 處理中文國際新聞（自動去除與本地重複的項目）
              if (zhData.articles) {
                zhData.articles.forEach(a => {
                  if (a.title && !seenTitles.has(a.title)) {
                    seenTitles.add(a.title);
                    newsList.push(`【國際】${converter(a.title)}`);
                  }
                });
              }

              if (newsList.length === 0) {
                newsList = ["香港神託會培敦中學即時氣象與交通系統運行中"];
              }

              fs.writeFileSync("news.json", JSON.stringify(newsList, null, 2));
              console.log("Successfully generated Chinese HK & Intl news.");
            } catch (err) {
              console.error(err);
              process.exit(1);
            }
          }
          getNews();
          '

      - name: Commit and Push if updated
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update Chinese HK & Intl news" && git push)
