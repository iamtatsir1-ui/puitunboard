name: Update News API Data

on:
  schedule:
    - cron: '*/15 * * * *' # 每 15 分鐘執行一次
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenCC
        run: npm install opencc-js

      - name: Fetch HK Local News and Convert to Traditional Chinese
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          node -e '
          const fs = require("fs");
          const OpenCC = require("opencc-js");
          // 設定轉換規則：簡體/通轉為香港繁體 (hk)
          const converter = OpenCC.Converter({ from: "cn", to: "hk" });

          async function getNews() {
            const key = process.env.NEWS_API_KEY;
            try {
              // 僅抓取香港本地新聞 (country=hk)
              const res = await fetch(`https://newsapi.org/v2/top-headlines?country=hk&pageSize=12&apiKey=${key}`);
              const data = await res.json();

              let newsList = [];
              if (data.articles && data.articles.length > 0) {
                // 過濾並全部轉為繁體中文
                newsList = data.articles
                  .map(a => a.title)
                  .filter(Boolean)
                  .map(title => converter(title));
              }

              if (newsList.length === 0) {
                newsList = ["香港神託會培敦中學即時氣象與交通系統運行中"];
              }

              fs.writeFileSync("news.json", JSON.stringify(newsList, null, 2));
              console.log("HK local news generated successfully.");
            } catch (err) {
              console.error(err);
              process.exit(1);
            }
          }
          getNews();
          '

      - name: Commit and Push if updated
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update HK local news (Traditional Chinese)" && git push)
