name: Update News Data (RTHK)

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch RTHK Local News
        run: |
          node -e '
          const fs = require("fs");

          async function getRTHKNews() {
            try {
              // 抓取香港電台本地即時新聞 RSS
              const res = await fetch("https://rthk.hk/rthk/news/rss/c_expressnews_clocal.xml", {
                headers: { "User-Agent": "Mozilla/5.0" }
              });
              const xmlText = await res.text();

              // 解析 XML 中的新聞標題
              const matches = xmlText.match(/<title><!\[CDATA\[(.*?)\]\]><\/title>/g) || [];
              let newsList = matches
                .map(m => m.replace(/<title><!\[CDATA\[/, "").replace(/\]\]><\/title>/, "").trim())
                .filter(title => title && title !== "香港電台新聞簡訊" && title !== "即時新聞");

              // 取前 10 條新聞
              newsList = newsList.slice(0, 10).map(title => `【本地】${title}`);

              if (newsList.length === 0) {
                newsList = ["香港神託會培敦中學即時氣象與交通系統運行中"];
              }

              fs.writeFileSync("news.json", JSON.stringify(newsList, null, 2));
              console.log("成功更新 RTHK 新聞，共 " + newsList.length + " 條。");
            } catch (err) {
              console.error("抓取 RTHK 失敗:", err);
              fs.writeFileSync("news.json", JSON.stringify(["香港神託會培敦中學即時氣象與交通系統運行中"], null, 2));
            }
          }

          getRTHKNews();
          '

      - name: Auto Commit and Push news.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update RTHK HK news"
          file_pattern: "news.json"
