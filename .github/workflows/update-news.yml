name: Update News API Data

on:
  schedule:
    - cron: '*/15 * * * *' # 每 15 分鐘執行一次
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch News API and Generate JSON
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          node -e '
          const fs = require("fs");
          async function getNews() {
            const key = process.env.NEWS_API_KEY;
            try {
              // 直接結合 country=hk 與 language=zh 抓取香港中文新聞
              const res = await fetch(`https://newsapi.org/v2/top-headlines?country=hk&language=zh&pageSize=10&apiKey=${key}`);
              const data = await res.json();

              let newsList = [];
              if (data.articles && data.articles.length > 0) {
                newsList = data.articles.map(a => a.title);
              } else {
                newsList = ["香港神託會培敦中學即時氣象與交通系統運行中"];
              }

              fs.writeFileSync("news.json", JSON.stringify(newsList, null, 2));
              console.log("news.json generated successfully.");
            } catch (err) {
              console.error(err);
              process.exit(1);
            }
          }
          getNews();
          '

      - name: Commit and Push if updated
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update news.json" && git push)
