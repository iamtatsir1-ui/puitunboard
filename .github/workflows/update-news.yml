name: Update News API Data

on:
  schedule:
    - cron: '*/15 * * * *' # 每 15 分鐘執行一次
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenCC
        run: npm install opencc-js

      - name: Fetch Chinese HK & International News
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          node -e '
          const fs = require("fs");
          const OpenCC = require("opencc-js");
          const converter = OpenCC.Converter({ from: "cn", to: "hk" });

          async function fetchNews(url) {
            const res = await fetch(url, {
              headers: { "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" }
            });
            const data = await res.json();
            if (data.status !== "ok") {
              console.error("NewsAPI 回應異常:", data.message || data);
              return [];
            }
            return data.articles || [];
          }

          async function getNews() {
            const key = process.env.NEWS_API_KEY;
            if (!key) {
              console.error("錯誤：Secrets 中未找到 NEWS_API_KEY！");
              process.exit(1);
            }

            try {
              const [hkArticles, zhArticles] = await Promise.all([
                fetchNews(`https://newsapi.org/v2/top-headlines?country=hk&pageSize=8&apiKey=${key}`),
                fetchNews(`https://newsapi.org/v2/top-headlines?language=zh&pageSize=8&apiKey=${key}`)
              ]);

              let newsList = [];
              const seenTitles = new Set();

              hkArticles.forEach(a => {
                if (a.title && !seenTitles.has(a.title)) {
                  seenTitles.add(a.title);
                  newsList.push(`【本地】${converter(a.title)}`);
                }
              });

              zhArticles.forEach(a => {
                if (a.title && !seenTitles.has(a.title)) {
                  seenTitles.add(a.title);
                  newsList.push(`【國際】${converter(a.title)}`);
                }
              });

              if (newsList.length === 0) {
                newsList = ["香港神託會培敦中學即時氣象與交通系統運行中"];
              }

              fs.writeFileSync("news.json", JSON.stringify(newsList, null, 2));
              console.log("已成功產生 " + newsList.length + " 條新聞紀錄至 news.json");
            } catch (err) {
              console.error("執行過程發生錯誤:", err);
              process.exit(1);
            }
          }

          getNews();
          '

      - name: Commit and Push if updated
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update Chinese HK & Intl news" && git push)
