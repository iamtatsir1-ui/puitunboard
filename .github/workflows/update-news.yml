name: Update News API Data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch News API and Generate JSON
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          node -e '
          const fs = require("fs");
          async function getNews() {
            const key = process.env.NEWS_API_KEY;
            try {
              // 1. 抓取香港本地頭條 (中文)
              const hkRes = await fetch(`https://newsapi.org/v2/top-headlines?country=hk&pageSize=5&apiKey=${key}`);
              const hkData = await hkRes.json();
              
              // 2. 抓取華語/國際中文頭條 (zh)
              const zhRes = await fetch(`https://newsapi.org/v2/top-headlines?language=zh&pageSize=5&apiKey=${key}`);
              const zhData = await zhRes.json();

              let newsList = [];
              if (hkData.articles) {
                newsList.push(...hkData.articles.map(a => `【本地】${a.title}`));
              }
              if (zhData.articles) {
                const hkTitles = new Set(hkData.articles ? hkData.articles.map(a => a.title) : []);
                const zhArticles = zhData.articles.filter(a => !hkTitles.has(a.title));
                newsList.push(...zhArticles.map(a => `【國際】${a.title}`));
              }

              if (newsList.length === 0) {
                newsList = ["香港神託會培敦中學即時氣象與交通系統運行中"];
              }

              fs.writeFileSync("news.json", JSON.stringify(newsList, null, 2));
              console.log("news.json generated successfully.");
            } catch (err) {
              console.error(err);
              process.exit(1);
            }
          }
          getNews();
          '

      - name: Commit and Push if updated
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update news.json" && git push)
