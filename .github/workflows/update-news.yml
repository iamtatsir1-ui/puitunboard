name: Update News Data (RTHK HK & Intl)

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch RTHK Local & International News
        run: |
          node -e '
          const fs = require("fs");

          async function fetchRSS(url) {
            try {
              const res = await fetch(url, {
                headers: { "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" }
              });
              const xmlText = await res.text();
              const matches = xmlText.match(/<title><!\[CDATA\[(.*?)\]\]><\/title>/g) || [];
              return matches
                .map(m => m.replace(/<title><!\[CDATA\[/, "").replace(/\]\]><\/title>/, "").trim())
                .filter(title => title && title !== "香港電台新聞簡訊" && title !== "即時新聞");
            } catch (e) {
              console.error("Fetch error:", e);
              return [];
            }
          }

          async function getRTHKNews() {
            // 同時抓取香港本地新聞與國際新聞
            const [localTitles, intlTitles] = await Promise.all([
              fetchRSS("https://rthk.hk/rthk/news/rss/c_expressnews_clocal.xml"),
              fetchRSS("https://rthk.hk/rthk/news/rss/c_expressnews_cinternational.xml")
            ]);

            let newsList = [];

            // 各取前 6 條新聞
            localTitles.slice(0, 10).forEach(title => newsList.push(`【本地】${title}`));
            intlTitles.slice(0, 10).forEach(title => newsList.push(`【國際】${title}`));

            if (newsList.length === 0) {
              newsList = ["香港神託會培敦中學即時氣象與交通系統運行中"];
            }

            fs.writeFileSync("news.json", JSON.stringify(newsList, null, 2));
            console.log("成功更新 RTHK 本地與國際新聞，共 " + newsList.length + " 條。");
          }

          getRTHKNews();
          '

      - name: Auto Commit and Push news.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update RTHK HK & Intl news"
          file_pattern: "news.json"
